name: Native C build

on:
  push:
    branches:
      - windows-native-sdl3
  pull_request:
    branches:
      - master
      - windows-native-sdl3

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framebuffer-tests:
    name: Framebuffer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DWOLF3D_BUILD_SDL3_PLATFORM=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install SDL3 with vcpkg
        if: runner.os == 'Windows'
        run: vcpkg install sdl3:x64-windows

      - name: Configure SDL3 platform build
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build-sdl
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DWOLF3D_BUILD_LEGACY_GAME_OBJECTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build SDL3 platform and smoke test
        if: runner.os == 'Windows'
        run: cmake --build build-sdl --config Release --parallel

      - name: Run SDL3 smoke test headlessly
        if: runner.os == 'Windows'
        run: ctest --test-dir build-sdl -C Release -R platform_smoke --output-on-failure

      - name: Verify native launcher and missing-data startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The launcher intentionally exercises exit codes 1 and 2.
          $PSNativeCommandUseErrorActionPreference = $false
          $env:SDL_VIDEODRIVER = 'dummy'
          $exe = '.\build-sdl\Release\wolf3d_native.exe'

          $helpOutput = & $exe --help 2>&1
          $helpExitCode = $LASTEXITCODE
          $helpMessage = $helpOutput -join "`n"
          if ($helpExitCode -ne 0 -or $helpMessage -notmatch 'Usage:') {
            throw "Native launcher help failed (exit $helpExitCode): $helpMessage"
          }

          $missingDirectory = Join-Path $env:RUNNER_TEMP 'wolf3d-missing-data'
          $badDirectoryOutput = & $exe --data-dir $missingDirectory 2>&1
          $badDirectoryExitCode = $LASTEXITCODE
          $badDirectoryMessage = $badDirectoryOutput -join "`n"
          if ($badDirectoryExitCode -ne 2 -or $badDirectoryMessage -notmatch 'Unable to use game data directory') {
            throw "Invalid data-directory handling failed (exit $badDirectoryExitCode): $badDirectoryMessage"
          }

          $output = & $exe 2>&1
          $exitCode = $LASTEXITCODE
          $message = $output -join "`n"
          Write-Host "No-data startup exit code: $exitCode"
          Write-Host $message
          if ($exitCode -ne 1 -or $message -notmatch 'NO WOLFENSTEIN 3-D DATA FILES') {
            throw "Game did not reach its expected missing-data check (exit $exitCode): $message"
          }

      - name: Configure original gameplay C sources
        run: >-
          cmake -S . -B build-game
          -DWOLF3D_BUILD_SDL3_PLATFORM=OFF
          -DWOLF3D_BUILD_LEGACY_GAME_OBJECTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile original gameplay as C
        run: cmake --build build-game --target wolf3d_game_objects --config Release --parallel

      - name: Configure sanitised build
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build-sanitized
          -DWOLF3D_BUILD_SDL3_PLATFORM=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitised targets
        if: runner.os == 'Linux'
        run: cmake --build build-sanitized --parallel

      - name: Run sanitised tests
        if: runner.os == 'Linux'
        run: ctest --test-dir build-sanitized --output-on-failure
